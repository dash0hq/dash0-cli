# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: breaking

# The name of the component, or a single word describing the area of concern (e.g. dashboards, config, apply)
component: apply, diff

# A brief description of the change. Surround your text with quotes ("") if it needs to start with a backtick (`).
note: "`apply --since` now deletes a removed document that has no `dash0.com/id` or `dash0.com/origin` at the origin `apply` inferred for it, instead of failing the run."

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
issues: [333]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  The origin comes from the document's kind and `metadata.name` at the `--since` ref, and the `--dataset` of the run.
  Renaming `metadata.name` of such a document now deletes the asset at the old origin, and `apply` writes the new one.
  A `--since` run that used to stop with "no identifier its kind is upserted by" now deletes these assets, which is why this change is breaking.
  Datasets without a slug and AWS metric scrape configs without `dash0.com/id` still fail the run.
  `--since` skips, with a warning, an inferred origin that a document elsewhere in the repository still writes for the run's dataset.
  The dataset a directory was applied with is not in git, so a document moved to a directory applied with another dataset leaves the old asset in the first dataset; delete it by hand.
  `diff --since` lists the same deletions, and `diff` reads a document without an identifier at its inferred origin, so an asset `apply` already wrote shows as an update or no change.
  `diff` no longer crashes on a view without a `labels` block when the stored view has an id.

