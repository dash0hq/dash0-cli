# Use this changelog template to create an entry for release notes.

# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: new_component

# The name of the component, or a single word describing the area of concern (e.g. dashboards, config, apply)
component: github-actions

# A brief description of the change. Surround your text with quotes ("") if it needs to start with a backtick (`).
note: "Add the `sync-assets` GitHub Action for syncing a directory of Dash0 asset YAML files, deleting assets removed since the last push"

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
issues: [277]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  Wraps `dash0 apply --since <ref>`, deriving `<ref>` from the triggering event so a workflow does
  not have to hand-write `github.event.before`'s corner cases itself. The `since` input has three
  states: `auto` (default), `none` (always a plain create/update sync), or an explicit ref.

  Always runs a zero-API-call `apply --dry-run --agent-mode` preflight first, exposing
  `deletions`/`modifications` as action outputs and enforcing an optional `max-deletions` circuit
  breaker before any mutating call.

  See `.github/actions/sync-assets/README.md` for the full reference.

