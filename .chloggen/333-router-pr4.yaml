# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: breaking

# The name of the component, or a single word describing the area of concern, (e.g. dashboards, config, apply)
component: apply, datasets, aws-metric-scrape-configs

# A brief description of the change. Surround your text with quotes ("") if it needs to start with a backtick (`).
note: "`apply` and `create` now give new datasets and first AWS metric scrape configs a stable `dash0-cli_` origin, and fail when the file's `dash0.com/origin` differs from the stored one."

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
issues: [333]

# (Optional) One or more lines of additional information to render under the main note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  A dataset is still addressed by its slug, and an AWS metric scrape config by its integration id.
  Without `dash0.com/origin`, the CLI infers one from the slug or the integration id, so the same file gets the same origin in every run.
  A dataset whose slug is not found is created by its origin, which also restores a dataset deleted in the last 30 days.
  An AWS integration that is not found still fails, because the CLI cannot create one.
  Before, a new dataset or a first scrape config got a server-assigned `api-` origin, and a differing origin in the file was ignored.
  Remove `dash0.com/origin` from the file, or set it to the stored value, to keep applying an existing dataset or scrape config.

