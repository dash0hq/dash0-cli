# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: bug_fix

# The name of the component, or a single word describing the area of concern, (e.g. dashboards, config, apply)
component: notification-channels

# A brief description of the change. Surround your text with quotes ("") if it needs to start with a backtick (`).
note: "`notification-channels update -f` now addresses the channel by its `dash0.com/origin` label, as `apply` does."

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
issues: [366]

# (Optional) One or more lines of additional information to render under the main note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  A file with only an origin no longer fails with "no notification channel id given", and a file with both labels updates the channel at the origin instead of the one at the id.
  A file without an origin is still addressed by its `dash0.com/id` label.
