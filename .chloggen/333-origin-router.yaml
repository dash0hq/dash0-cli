change_type: breaking
component: apply, dashboards, teams, notification-channels, time-series-aggregations, spam-filters
note: "`apply` and `create` read `dash0.com/id` before `dash0.com/origin` for dashboards and teams, and never create a dashboard, team, notification channel, time series aggregation, or spam filter by POST."
issues: [333]
subtext: |
  When a document has `dash0.com/id`, the CLI updates the asset at that id, and fails when the stored origin differs from the origin in the file.
  When the id is not found, or the document has none, the CLI writes by `dash0.com/origin`, or by an origin it infers from the kind, `metadata.name`, and the dataset.
  Applying the same document again therefore updates the same asset, also without an identifier, and a time series aggregation no longer needs `dash0.com/origin`.
  The CLI sends the origin only when it creates an asset.
  Before, dashboards and teams were read by origin first, so a document whose origin and id named two different assets now updates the asset at the id.
  `update -f` without an argument reads `dash0.com/id` first, then `dash0.com/origin`, as `apply` does.
  It does not try the inferred origin.
  So it fails for a file with neither label, and for a file with only an id that is not found.
  `apply --since` deletes a removed document where `apply` wrote it.
  That is its id, or its origin or inferred origin when the id is not found.
  A removed document with neither label still fails the run.
  Two documents in one run that would get the same inferred origin fail validation.
