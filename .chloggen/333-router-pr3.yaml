change_type: breaking
component: apply, views, check-rules, synthetic-checks, recording-rules, dashboards
note: "`apply` and `create` route views, check rules, synthetic checks, recording rules, PersesDashboards, and PrometheusRules by `dash0.com/id`, then `dash0.com/origin`, and never create them by POST."
issues: [333]
subtext: |
  Applying the same document again now updates the same asset, also when the document has no identifier.
  Without `dash0.com/origin`, the CLI infers one from the kind, `metadata.name`, and the dataset.
  A check rule uses its top-level `name`, and reads its origin from its top-level `labels`.
  A CheckRule file whose `id` exists and whose `dash0.com/origin` label differs from it now fails, because Dash0 stores a check rule's origin as its id; before, the CLI dropped the label.
  Each alert of a PrometheusRule uses `metadata.name` and `<group name> - <alert name>`, and the recording rules use `metadata.name`.
  A PersesDashboard keeps its `dash0.com/id` and `dash0.com/origin` labels, which the conversion to a dashboard used to drop.
  Before, these kinds were written at the file's id, so a document whose id is not found now creates the asset at its origin or inferred origin, with a server-assigned id.
  Check rules and the alerting rules of a PrometheusRule are the exception: when the id is not found, the CLI creates the check rule at that id, so the id in the file is kept, and `check-rules update -f` fails instead of updating the rule at its origin.
  A document without an identifier used to create a new asset on every apply; now only the first apply after the upgrade creates one, and later applies update it.
  Set `dash0.com/origin` to the stored origin, or set `dash0.com/id`, to update the existing asset instead.
  Origins are unique per organization, so a document with an explicit `dash0.com/origin` now applies to one dataset only for PersesDashboards, check rules, PrometheusRules, synthetic checks, and views; before, the second dataset got a new asset by POST. Leave the origin out to get one inferred per dataset.
  A document whose `dash0.com/origin` is the inferred origin of another document in the run now fails validation.
  The CLI now sends `dash0.com/origin` when it creates one of these assets; a check rule gets it from the request path only, because its labels belong to its alerts. An update of a view, synthetic check, or recording rule at the stored origin sends that origin back, so a later read by id still shows it; an update never sends another origin.
  `update -f` without an argument and `apply --since` follow the same order.
