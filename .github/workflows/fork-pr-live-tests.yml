name: Fork PR live tests

# Fork pull requests get no secrets, so the jobs that need Dash0 credentials skip on
# their pull_request run. This workflow runs those jobs with the DASH0_* secrets once
# a maintainer approves the run in the fork-pr-live-tests environment.
#
# Only the workflow files come from main. Everything else comes from the fork and
# runs with the secrets: the Makefile, the test scripts, and the composite actions
# and scripts under .github/actions/. Review all of it before you approve. Each new
# push needs a new approval.

on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter lists the pull request's changed files

jobs:
  approve:
    if: github.event.pull_request.head.repo.full_name != github.repository
    environment: fork-pr-live-tests
    runs-on: ubuntu-latest
    steps:
      - run: echo "Approved live tests for ${{ github.event.pull_request.head.sha }}"

  ci:
    needs: approve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      live-only: true
    secrets:
      DASH0_API_URL: ${{ secrets.DASH0_API_URL }}
      DASH0_AUTH_TOKEN: ${{ secrets.DASH0_AUTH_TOKEN }}
      DASH0_OTLP_URL: ${{ secrets.DASH0_OTLP_URL }}
      DASH0_DATASET: ${{ secrets.DASH0_DATASET }}
      DASH0_OAUTH_CLIENT_ID: ${{ secrets.DASH0_OAUTH_CLIENT_ID }}
      DASH0_OAUTH_REFRESH_TOKEN: ${{ secrets.DASH0_OAUTH_REFRESH_TOKEN }}

  send-log-event:
    needs: approve
    uses: ./.github/workflows/test-send-log-event-action.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      live-only: true
    secrets:
      DASH0_AUTH_TOKEN: ${{ secrets.DASH0_AUTH_TOKEN }}

  sync-assets:
    needs: approve
    uses: ./.github/workflows/test-sync-assets-action.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      live-only: true
    secrets:
      DASH0_API_URL: ${{ secrets.DASH0_API_URL }}
      DASH0_AUTH_TOKEN: ${{ secrets.DASH0_AUTH_TOKEN }}
      DASH0_DATASET: ${{ secrets.DASH0_DATASET }}
