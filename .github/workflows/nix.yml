name: Nix

# Keeps the Nix packaging green: builds the flake package and runs the flake
# checks (the Home Manager module's assertion and seed-merge unit tests).
on:
  push:
    branches:
      - main
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/nix.yml"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/nix.yml"
  workflow_dispatch:

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Build the CLI package
        run: nix build .#dash0 --print-build-logs

      - name: Run flake checks
        run: nix flake check --print-build-logs
